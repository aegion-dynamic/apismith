    # --- Auth Schemas ---

    AuthSignUpRequest:
      type: object
      description: Request body for user sign-up
      properties:
        email:
          type: string
          format: email
          description: User's email address (used as the login username)
          example: john.doe@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: "Password (min 8 chars; must meet Cognito policy: uppercase, lowercase, number, special char)"
          example: MySecure@123
        first_name:
          type: string
          description: User's first name
          example: John
        last_name:
          type: string
          description: User's last name
          example: Doe
        phone:
          type: string
          description: "User's phone number in E.164 format (optional)"
          example: '+1234567890'
      required:
        - email
        - password
        - first_name
        - last_name

    AuthVerifyEmailRequest:
      type: object
      description: Request body for email OTP verification
      properties:
        email:
          type: string
          format: email
          description: The email address that was used during sign-up
          example: john.doe@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: The 6-digit OTP code sent to the email
          example: '123456'
      required:
        - email
        - code

    AuthResendVerificationRequest:
      type: object
      description: Request body to resend the email verification OTP
      properties:
        email:
          type: string
          format: email
          description: The email address to resend the OTP to
          example: john.doe@example.com
      required:
        - email

    AuthLoginRequest:
      type: object
      description: Request body for user login
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
        password:
          type: string
          format: password
          description: User's password
          example: MySecure@123
      required:
        - email
        - password

    AuthForgotPasswordRequest:
      type: object
      description: Request body to initiate forgot-password flow
      properties:
        email:
          type: string
          format: email
          description: The email address associated with the account
          example: john.doe@example.com
      required:
        - email

    AuthResetPasswordRequest:
      type: object
      description: Request body to reset password with verification code
      properties:
        email:
          type: string
          format: email
          description: The email address associated with the account
          example: john.doe@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: The verification code received via email
          example: '123456'
        new_password:
          type: string
          format: password
          minLength: 8
          description: "The new password (must meet Cognito policy)"
          example: NewSecure@456
      required:
        - email
        - code
        - new_password

    AuthChangePasswordRequest:
      type: object
      description: Request body to change password for an authenticated user. Access token must be provided via the Authorization header.
      properties:
        previous_password:
          type: string
          format: password
          description: The user's current password
          example: MySecure@123
        new_password:
          type: string
          format: password
          minLength: 8
          description: "The new password (must meet Cognito policy)"
          example: NewSecure@456
      required:
        - previous_password
        - new_password

    AuthRefreshRequest:
      type: object
      description: Request body to refresh an access token using a refresh token
      properties:
        refresh_token:
          type: string
          description: The refresh token issued at login
        sub:
          type: string
          description: >
            The Cognito user sub (subject UUID, NOT the email). Required only
            when the app client has a secret: REFRESH_TOKEN_AUTH verifies
            SECRET_HASH against the token subject, so a hash built from the
            email is rejected. Available in the id_token sub claim.
            Public (no-secret) clients omit it.
      required:
        - refresh_token

    AuthRespondNewPasswordRequest:
      type: object
      description: Request body to set a new password and complete a NEW_PASSWORD_REQUIRED challenge
      properties:
        email:
          type: string
          format: email
          description: The user's email address
          example: john.doe@example.com
        temporary_password:
          type: string
          format: password
          description: The temporary password the user was emailed
          example: Temp@1234
        new_password:
          type: string
          format: password
          minLength: 8
          description: The new password (must meet Cognito policy)
          example: NewSecure@456
      required:
        - email
        - temporary_password
        - new_password

    AuthLoginResponse:
      type: object
      description: Successful login response containing JWT tokens
      properties:
        access_token:
          type: string
          description: JWT access token for authenticating API requests
        id_token:
          type: string
          description: JWT ID token containing user claims
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens
        expires_in:
          type: integer
          description: Token validity duration in seconds
          example: 3600
        token_type:
          type: string
          description: Token type (always "Bearer")
          example: Bearer
        challenge:
          type: string
          description: >-
            Set when the caller must complete a challenge before tokens are issued — e.g.
            `NEW_PASSWORD_REQUIRED` for an invited user who must choose their own password on first
            login. When present the token fields are empty; complete it via /auth/respond-new-password.
          example: NEW_PASSWORD_REQUIRED
      required:
        - access_token
        - id_token
        - refresh_token
        - expires_in
        - token_type

    AuthMessageResponse:
      type: object
      description: Generic success response with a message
      properties:
        message:
          type: string
          description: Human-readable success message
          example: Operation completed successfully
      required:
        - message


    AuthErrorResponse:
      type: object
      description: |-
        Error response with a machine-readable code and human-readable message.
        Possible error codes:
        - `USER_ALREADY_EXISTS` - Email is already registered
        - `USER_NOT_CONFIRMED` - Email not yet verified (must complete OTP verification)
        - `INVALID_CREDENTIALS` - Wrong email or password
        - `INVALID_CODE` - The OTP/verification code is incorrect
        - `EXPIRED_CODE` - The OTP/verification code has expired
        - `INVALID_PASSWORD` - Password does not meet requirements
        - `USER_NOT_FOUND` - No account found with this email
        - `RATE_LIMIT_EXCEEDED` - Too many requests, try again later
        - `INTERNAL_ERROR` - Unexpected server error
      properties:
        code:
          type: string
          description: Machine-readable error code for programmatic handling
          example: USER_NOT_CONFIRMED
          enum:
            - USER_ALREADY_EXISTS
            - USER_NOT_CONFIRMED
            - INVALID_CREDENTIALS
            - INVALID_CODE
            - EXPIRED_CODE
            - INVALID_PASSWORD
            - USER_NOT_FOUND
            - RATE_LIMIT_EXCEEDED
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable error description
          example: Email address has not been verified. Please check your email for the OTP code.
      required:
        - code
        - message

    OauthTokenResponse:
      type: object
      description: Successful token response, RFC 6749 section 5.1.
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds
        refresh_token:
          type: string
          description: Refresh token for social sign-in sessions (Nimbus-issued, send to POST /auth/refresh). Absent for client-credentials and anonymous grants.
      required:
        - access_token
        - token_type

    CreateSequenceRequestBody:
      type: object
      required:
