        '400':
          description: Bad request
        '500':
          description: Error invoking function  
  /users:
    post:
      summary: Create a new Nimbus user and send invite
      description: |
        Creates a Nimbus user for the given email. If a default OIDC provider is configured, also provisions the user in that OIDC provider. In all cases an invitation email is sent. The user has no provider identity until their first OIDC login, when the account is linked via verified email.
      operationId: createNimbusUser
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNimbusUserRequestBody'
      responses:
        '201':
          description: Invited user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NimbusUserResponseBody'
        '400':
          description: Invalid input
        '401':
          description: unauthorized error
        '409':
          description: User already exists
        '500':
          description: Internal server error
    get:
      summary: Retrieve a list of Cognito users
      operationId: getNimbusCognitoUsers
      tags:
        - users
      parameters:
        - name: limit
          in: query
          description: Maximum number of users to return
          required: false
          schema:
            type: integer
            example: 10
        - name: offset
          in: query
          description: Number of users to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            example: 0
      responses:
        '200':
          description: A list of Cognito users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NimbusUserResponseBody'
        '500':
          description: Internal server error
        '400':
          description: Bad request
        '401':
          description: unauthorized error
    put:
      summary: Update the authenticated user's profile (name, phone)
      operationId: UpdateNimbusUserInformation
      tags:
        - users
      requestBody:
        description: Fields to update on the authenticated user's profile. All fields are optional; only supplied fields are changed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNimbusUserRequestBody'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NimbusUserResponseBody'
        '400':
          description: Invalid ID supplied
        '404':
          description: User not found
        '500':
          description: server error
        '401':
          description: unauthorized error
  /users/me:
    get:
      summary: Get the authenticated user's profile
