          description: UUID of the organization to scope this request to
        lookupKey:
          type: string
          description: Lookup key for the sequence (e.g. PO, INV), unique per organization
        formatString:
          type: string
          nullable: true
          description: Optional format template with placeholders {lookup_key}, {value}, {year}, {min_digits}. Validated on create.
        label:
          type: string
          nullable: true
          description: Optional human-readable label
        description:
          type: string
          nullable: true
          description: Optional longer description
        startValue:
          type: integer
          format: int64
          default: 1
          description: First value to be returned (defaults to 1)
        minDigits:
          type: integer
          default: 5
          description: Minimum number of digits for zero-padded output
        includeYear:
          type: boolean
          default: false
          description: Include current year in formatted output

    SequenceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        organizationId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        lookupKey:
          type: string
        formatString:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        currentValue:
          type: integer
          format: int64
        minDigits:
          type: integer
        includeYear:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SequenceNextValueResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        organizationId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        lookupKey:
          type: string
        value:
          type: integer
          format: int64
          description: Raw numeric value
        formatted:
          type: string
          description: Formatted sequence string (e.g. PO-00042 or PO-2026-00042)

    SequenceNextValueOnlyResponse:
