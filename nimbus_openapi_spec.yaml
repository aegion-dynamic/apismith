# ── Codegen convention: UUID type mapping ────────────────────────────────────
# UUID path/query/body fields use `format: uuid` WITH `x-go-type: uuid.UUID` so
# oapi-codegen emits the gofrs github.com/gofrs/uuid/v5 `uuid.UUID` used across core/
# and the handlers — NOT the default openapi_types.UUID. Apply x-go-type PER uuid
# field. Do NOT blanket-add or blanket-strip it across the whole spec: a few endpoints
# (e.g. /audit-logs/*) intentionally use the default openapi_types.UUID and convert in
# their handlers, so forcing x-go-type there breaks the build. The drift gate
# (check-drift-oapi) locks the generated output. See README + docs/RBAC_DESIGN.md.
# ─────────────────────────────────────────────────────────────────────────────

components:
  schemas:
    # --- Workflow (Petri net) Schemas ---

    CreateWorkflowDefinitionRequest:
      type: object
      required:
        - lookupKey
        - definition
      properties:
        lookupKey:
          type: string
          description: Stable name shared across versions of the same net
        definition:
          type: object
          additionalProperties: true
          description: >
            Generic Petri net JSON (schemaVersion, tokenTypes, places, transitions, initialMarking).
            A token type is only a name, and arc weights are constants in this JSON.

            This net collects three signatures in any order, then completes.
            T_issue consumes 1 doc and produces 1 doc plus 3 sign_slot tokens.
            T_sign consumes 1 sign_slot and produces 1 signature, and can fire three times.
            T_finalize consumes the doc and 3 signature tokens and places the doc in a final place.
            The instance stays running until T_finalize. Three signature tokens mean three signs
            have been received.
          example:
            schemaVersion: "1.0"
            tokenTypes: [doc, sign_slot, signature]
            places:
              - id: P_draft
                label: Draft
              - id: P_circulating
                label: Out for signature
              - id: P_open
                label: Open signature slots
              - id: P_signed
                label: Collected signatures
              - id: P_complete
                label: Complete
                final: true
            transitions:
              - id: T_issue
                label: Issue for signature
                inputs:
                  - place: P_draft
                    require:
                      doc: 1
                outputs:
                  - place: P_circulating
                    produce:
                      doc: 1
                  - place: P_open
                    produce:
                      sign_slot: 3
              - id: T_sign
                label: Collect one signature
                inputs:
                  - place: P_open
                    require:
                      sign_slot: 1
                outputs:
                  - place: P_signed
                    produce:
                      signature: 1
              - id: T_finalize
                label: Complete signed document
                inputs:
                  - place: P_circulating
                    require:
                      doc: 1
                  - place: P_signed
                    require:
                      signature: 3
                outputs:
                  - place: P_complete
                    produce:
                      doc: 1
            initialMarking:
              - place: P_draft
                tokens:
                  doc: 1
        label:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    UpdateWorkflowDefinitionRequest:
      type: object
      properties:
        label:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
          nullable: true

    CreateSignTemplateRequest:
      type: object
      required:
        - organizationId
        - name
        - typstSource
      properties:
        organizationId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        name:
          type: string
        typstSource:
          type: string
          description: Typst markup. Signature blocks read params.signers. A signer image is params.images.at(signer.imageId) after that signer has signed.
        parameters:
          type: object
          additionalProperties: true
          nullable: true
          description: Business fields frozen onto each request created from this template.

    SignTemplateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        organizationId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        name:
          type: string
        typstSource:
          type: string
        parameters:
          type: object
          additionalProperties: true
          nullable: true
        createdBy:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSignRequestRequest:
      type: object
      required:
        - templateId
        - signerUserIds
      properties:
        templateId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        signerUserIds:
          type: array
          minItems: 1
          description: Internal organization members, in signing position order. Each entry becomes token sig_uN and transition T_uN.
          items:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
        parameters:
          type: object
          additionalProperties: true
          nullable: true
          description: Replaces the template parameters for this request. Omitted values keep the template parameters.

    SignRequestSignature:
      type: object
      required:
        - signature
      properties:
        signature:
          type: string
          description: Base64-encoded signature image. Stored on field key signature and passed to the next PDF compile as an image.

    SignFieldValueResponse:
      type: object
      properties:
        fieldKey:
          type: string
        textValue:
          type: string
          nullable: true

    SignRequestItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        userId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        tokenKey:
          type: string
          description: Unique workflow token type this signer produces.
        position:
          type: integer
        status:
          type: string
          enum:
            - pending
            - signed
            - declined
        signedAt:
          type: string
          format: date-time
          nullable: true
        fieldValues:
          type: array
          items:
            $ref: '#/components/schemas/SignFieldValueResponse'

    SignRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        organizationId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        templateId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        status:
          type: string
          enum:
            - draft
            - sent
            - completed
            - closed
        closureReason:
          type: string
          nullable: true
        typstSource:
          type: string
        parameters:
          type: object
          additionalProperties: true
          nullable: true
        workflowDefinitionId:
          type: string
          format: uuid
          nullable: true
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        workflowInstanceId:
          type: string
          format: uuid
          nullable: true
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        createdBy:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/SignRequestItemResponse'

    WorkflowDefinitionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        lookupKey:
          type: string
        version:
          type: integer
        definition:
          type: object
          additionalProperties: true
        label:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWorkflowInstanceRequest:
      type: object
      properties:
        definitionId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
          nullable: true
        lookupKey:
          type: string
          nullable: true
          description: Alternative to definitionId; starts the latest (or specified) version
        version:
          type: integer
          nullable: true
          description: Used with lookupKey to pin a specific version
        externalRef:
          type: string
          nullable: true
          description: Optional caller business key for idempotent start
        context:
          type: object
          additionalProperties: true
          nullable: true
          description: Opaque caller data stored on the instance

    WorkflowMarkingEntry:
      type: object
      required:
        - place
        - tokenType
        - count
      properties:
        place:
          type: string
        tokenType:
          type: string
        count:
          type: integer

    WorkflowInstanceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        definitionId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        externalRef:
          type: string
          nullable: true
        status:
          type: string
          enum: [running, completed, terminated]
        context:
          type: object
          additionalProperties: true
          nullable: true
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    WorkflowInstanceViewResponse:
      type: object
      properties:
        instance:
          $ref: '#/components/schemas/WorkflowInstanceResponse'
        marking:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMarkingEntry'
        enabledTransitions:
          type: array
          items:
            type: string
        deadlocked:
          type: boolean
        complete:
          type: boolean

    WorkflowEnabledTransitionsResponse:
      type: object
      properties:
        enabledTransitions:
          type: array
          items:
            type: string
        deadlocked:
          type: boolean
        complete:
          type: boolean
        revision:
          type: integer
        status:
          type: string

    FireWorkflowTransitionRequest:
      type: object
      properties:
