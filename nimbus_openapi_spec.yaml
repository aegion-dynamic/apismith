        toEmail:
          type: array
          description: List of recipients.
          items:
            $ref: '#/components/schemas/EmailObject'
          minItems: 1
        data:
          type: object
          description: Values rendered into the template. All template-referenced fields are required.
        inlineAttachments:
          type: array
          description: Attachments provided as base64 payloads (user-uploaded files).
          items:
            $ref: '#/components/schemas/EmailInlineAttachment'
        fileAttachments:
          type: array
          description: |
            Attachments referenced by fileId (e.g. server-generated PDFs
            previously persisted via the file-upload flow).
          items:
            $ref: '#/components/schemas/EmailFileAttachment'
      required:
        - template
        - toEmail
        - data

