  /sign/requests/{requestId}/send:
    post:
      tags:
        - sign
      summary: Send a sign request
      description: Publishes a net with one unique token per signer, starts it, and fires T_start. T_finish stays disabled until every signer token exists.
      operationId: sendSignRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
      responses:
        '200':
          description: Request is out for signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignRequestResponse'
        '403':
          description: Caller is not the sender
        '404':
          description: Request not found
        '409':
          description: Request is not a draft
        '500':
          description: Internal server error

  /sign/requests/{requestId}/sign:
    post:
      tags:
        - sign
      summary: Sign a request
      description: The assigned user stores a signature image and fires the transition that produces their unique token. The last signature also fires T_finish.
      operationId: signSignRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequestSignature'
      responses:
        '200':
          description: Signature recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignRequestResponse'
        '400':
          description: Missing signature image
        '403':
          description: Caller is not an assigned signer
        '404':
          description: Request not found
        '409':
          description: Request is not out for signature
        '500':
          description: Internal server error

  /sign/requests/{requestId}/cancel:
    post:
      tags:
        - sign
      summary: Cancel a sign request
      description: The sender terminates the workflow and closes the request.
      operationId: cancelSignRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
      responses:
        '200':
          description: Request closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignRequestResponse'
        '403':
          description: Caller is not the sender
        '404':
          description: Request not found
        '409':
          description: Request is already completed or closed
        '500':
          description: Internal server error

  /sign/requests/{requestId}/decline:
    post:
      tags:
        - sign
      summary: Decline a sign request
      description: The assigned signer refuses. The workflow is terminated and the request is closed.
      operationId: declineSignRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
      responses:
        '200':
          description: Request closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignRequestResponse'
