          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserOrganizationResponse'
        '401':
          description: unauthorized error
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []
  /users/{id}:
