openapi: 3.0.3
info:
  title: Nimbus - OpenAPI 3.0
  description: |-
    This is the Nimbus based on the OpenAPI 3.0 specification. Nimbus by Aegion Dynamic is a powerful framework that enables seamless integration and management of data across various systems and platforms. It serves as the foundation for a microsaas framework, allowing developers to build scalable and modular software-as-a-service applications.

    With Nimbus, you can easily connect, transform, and analyze data from different sources, providing a unified view of your data landscape. It offers a range of features and capabilities, including data synchronization, real-time data processing, and data governance.

    In this version of Nimbus, we have adopted a design-first approach, allowing for greater flexibility and extensibility. You can contribute to the improvement of Nimbus by suggesting changes to the API definition or by contributing to the codebase.

    Here are some useful links to get started with Nimbus:
    - [Nimbus GitHub repository](https://github.com/aegion-dynamic/nimbus-backend)
    - [API definition for Nimbus](https://github.com/aegion-dynamic/nimbus-backend/blob/master/src/main/resources/nimbus_openapi_spec.yaml)

  version: '1'
externalDocs:
  description: Find out more about Nimbus
  url: https://aegion-dynamic.gitbook.io/nimbus
servers:
  - url: http://localhost:8080/api/v1
    description: Localhost server
tags:
  - name: files
    description: Operations about files
  - name: queues
    description: Operations about queues
  - name: tasks
    description: Operations about tasks
  - name: compute
    description: Operations that call cloud functions
  - name: organizations
    description: Organization membership and access management
  - name: users
    description: Operations to manage all the users
  - name: fileserve
    description: Operations to deliver files to different users
  - name: auth
    description: Authentication endpoints (signup, login, email verification, password reset). All auth endpoints are public and do not require a Bearer token.
  - name: sequences
    description: Operations for managing auto-increment sequences
  - name: acl
    description: Resource-level grant management (linux-like rwx sharing of files and queues with users and teams)
  - name: audit-logs
    description: Read-only audit trail endpoints for compliance (SOC 2 / GDPR / ISO 27001)
  - name: cron
    description: EventBridge Scheduler cron rows (Unix 5-field expressions, reconciled to AWS)
  - name: events
    description: Dynamic event.trigger rows (event type to policy or graphql action)
  - name: workflow
    description: >
      Generic Petri net definitions and instances. The engine counts named tokens.
      It is not specialized for a business process. A document that needs three
      signatures is one such net: three signature tokens mean three signs have
      been received. Who signed, and what a signature looks like, are outside the net.
  - name: sign
    description: >
      Internal document e-sign. The sender selects N organization members. Each
      member gets a unique workflow token. T_start opens the envelope and T_finish
      runs only after every token has been produced. The PDF is compiled from the
      frozen Typst source plus the current signer state.

# Default: every operation requires a Bearer token unless it explicitly sets `security: []`.
security:
  - nimbus_auth: []

paths:
  /auth/signup:
    post:
      summary: Sign up with email and password
      description: |-
        Registers a new user account with Amazon Cognito. An OTP verification code
        will be sent to the provided email address. The user must verify their email
        using the `/auth/verify-email` endpoint before they can log in.
      operationId: authSignUp
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignUpRequest'
      responses:
        '200':
          description: Sign-up successful. An OTP has been sent to the email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMessageResponse'
        '400':
          description: Invalid input (e.g., weak password, missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: A user with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/verify-email:
    post:
      summary: Verify email address with OTP code
      description: |-
        Confirms the user's email address using the 6-digit OTP code sent during
        sign-up. On success, the user's record is automatically synced to the
        database, making them ready for authenticated API access.
      operationId: authVerifyEmail
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerifyEmailRequest'
      responses:
        '200':
          description: Email verified successfully and user synced to database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMessageResponse'
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/resend-verification:
    post:
      summary: Resend email verification OTP code
      description: |-
        Resends the OTP verification code to the user's email address.
        Use this when the original code has expired or was not received.
      operationId: authResendVerification
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResendVerificationRequest'
      responses:
        '200':
          description: Verification code resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMessageResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/login:
    post:
      summary: Log in with email and password
      description: |-
        Authenticates a user with email and password. Returns JWT tokens
        (access_token, id_token, refresh_token) on success.

        If the user has not verified their email, a 403 response with error code
        `USER_NOT_CONFIRMED` is returned. The frontend should redirect to the
        email verification page and optionally call `/auth/resend-verification`.
      operationId: authLogin
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login successful. Returns JWT tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: User not confirmed (email not verified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/forgot-password:
    post:
      summary: Initiate forgot-password flow
      description: |-
        Sends a password-reset verification code to the user's email address.
        The code should be submitted along with the new password to
        `/auth/reset-password` to complete the flow.
      operationId: authForgotPassword
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthForgotPasswordRequest'
      responses:
        '200':
          description: Password reset code sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMessageResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/reset-password:
    post:
      summary: Reset password with verification code
      description: |-
        Completes the forgot-password flow by confirming the verification code
        and setting a new password. The verification code is the one sent by
        the `/auth/forgot-password` endpoint.
      operationId: authResetPassword
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMessageResponse'
        '400':
          description: Invalid or expired code, or invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/change-password:
    post:
      summary: Change password for authenticated user
      description: |-
        Changes the password for an authenticated user. Requires the user's
        current access token in the `Authorization: Bearer <token>` header,
        the current password, and the new password.

        Unlike other auth endpoints, this requires a valid access token.
      operationId: authChangePassword
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMessageResponse'
        '400':
          description: Invalid new password (does not meet requirements)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Invalid access token or incorrect current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/providers:
    get:
      summary: List enabled social sign-in providers
      operationId: listAuthProviders
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: Enabled providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: string

  /auth/providers/{name}/authorize:
    get:
      summary: Start social sign-in with a provider
      description: Redirects the browser to the provider's authorization page.
      operationId: authProviderAuthorize
      tags:
        - Auth
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the provider
        '400':
          description: Unknown or unconfigured provider

  /auth/providers/{name}/callback:
    get:
      summary: Social sign-in callback
      description: |
        Exchanges the provider's code, creates or logs in the Nimbus user, and
        redirects to the frontend callback URL with the Nimbus token in the URL
        fragment (`#token=...`), so the token is not sent in HTTP requests.
      operationId: authProviderCallback
      tags:
        - Auth
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the frontend with ?token=...
        '400':
          description: Unknown provider or exchange failed
        '403':
          description: State mismatch

  /auth/providers/{name}/token:
    post:
      summary: Exchange a provider token for a Nimbus token (direct login without Hosted UI)
      description: |
        Verifies a token obtained directly from the provider (e.g. Cognito ID token via USER_PASSWORD_AUTH, Google ID token, etc.) against the provider's JWKS/OIDC discovery or userinfo endpoint, JIT-provisions the Nimbus user exactly like the callback handler, and mints the same oauth-package HMAC token.
        Works for all configured providers — OIDC providers verify the ID token via OIDC discovery, OAuth2 providers verify by fetching userinfo. This is the non-redirect counterpart to the authorize → callback flow, enabling same-page email/password forms.
      operationId: authProviderToken
      tags:
        - Auth
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: OIDC ID token (for OIDC providers like Cognito, Google, etc.)
                access_token:
                  type: string
                  description: Access token / provider-issued JWT (for OAuth2 or OIDC userinfo)
              additionalProperties: false
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                access_token:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Nimbus token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTokenResponse'
        '400':
          description: Missing token, unknown provider or token exchange failed
        '401':
          description: Invalid provider token
        '500':
          description: Internal server error

  /oauth/token:
    post:
      summary: Exchange a grant for an access token
      description: |
        Public token endpoint. Issues a Bearer access token for the grant in
        `grant_type`. Supported grants:
        - `anonymous` - mint an anonymous visitor token (no credentials needed)
        RFC 6749 section 4.4 / 5.1.
      operationId: oauthToken
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - anonymous
              required:
                - grant_type
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTokenResponse'
        '400':
          description: invalid_request or unsupported_grant_type

  /auth/refresh:
    post:
      summary: Refresh access token using a refresh token
      description: |-
        Exchanges a valid refresh token for a new access token (and id token) using
        the Cognito `REFRESH_TOKEN_AUTH` flow. Used to silently keep a session alive
        without forcing the user to log in again.

        Cognito does not issue a new refresh token on this flow, so the returned
        `refresh_token` echoes the one supplied; the caller should keep reusing it
        until it expires, at which point a fresh login is required.
      operationId: authRefresh
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Token refreshed successfully. Returns new JWT tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'


  /auth/respond-new-password:
    post:
      summary: Set a new password to complete a NEW_PASSWORD_REQUIRED challenge
      description: |-
        Completes the first-login flow for an invited user. Given the user's email, their temporary
        password, and a chosen new password, the server authenticates with the temporary password,
        responds to the Cognito NEW_PASSWORD_REQUIRED challenge, and returns the JWT tokens. After
        this the user signs in normally with their new password.
      operationId: authRespondNewPassword
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRespondNewPasswordRequest'
      responses:
        '200':
          description: New password set; returns JWT tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Invalid new password (does not meet requirements)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Invalid email or temporary password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'


  /accesscontrol/me:
    get:
      tags:
        - access-control
      summary: Effective permissions for the authenticated caller
      description: Returns the caller's resolved roles and effective permissions
        (operations, pages, actions) — the additive union of org base role, direct role
        assignments, and team roles, expanded through the role hierarchy. One call
        replaces per-path ability lookups and client-side role-string matching.
      operationId: getNimbusMyPermissions
      responses:
        '200':
          description: Effective permissions for the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePermissions'
        '401':
          description: unauthorized error
        '500':
          description: Server Error
      security:
        - nimbus_auth: []
  /roles/{userId}:
    get:
      tags:
        - access-control
      summary: Get user roles for a nimbus user id
      description: Returns a single task
      operationId: getNimbusUserRoles
      parameters:
        - name: userId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
      responses:
        '200':
          description: response for check access response body
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/userRolesResponseBody'
                x-content-type: application/json  
        '400':
          description: Bad request
        '401':
          description: unauthorized error
        '500':
          description: Error invoking function
  /roles/attach/{userId}:
    post:
      tags:
        - access-control
      summary: create a user role mapping
      description: create a user role mapping
      operationId: attachNimbusUserRoleMapping
      parameters:
        - name: userId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachUserRoleRequestBody'
      responses:
        '200':
          description: user-role mapping created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachUserRoleMapResponseBody'
        '400':
          description: Bad request
        '401':
          description: unauthorized error
        '500':
          description: Internal server error
  /roles/detach/{userId}:
    post:
      tags:
        - access-control
      summary: detach user from roles
      description: detach user from roles
      operationId: detachNimbusUserRoleMapping
      parameters:
        - name: userId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetachUserRoleRequestBody'
              
      responses:
        '200':
          description: user-role mapping created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userRoleMapResponseBody'
        '400':
          description: Bad request
        '401':
          description: unauthorized error
        '500':
          description: Internal server error
  /roles:
    post:
      tags:
        - access-control
      description: create a role in the system
      operationId: createNimbusRole
      requestBody:
        description: role object to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequestBody'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Invalid input
        '401':
          description: unauthorized error
        '500':
          description: Internal error
    get:
      tags:
        - access-control
      summary: Get all roles
      description: Get all roles
      operationId: getNimbusAllRoles
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                 $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Invalid input
        '401':
          description: unauthorized error        
        '500':
          description: Server Error
  
  /roles/users/{roleName}:
    get:
      tags:
        - access-control
      summary: Gets all users for a sepecified role that the user passes. This is part of the visibility spec that we are adding to access control and we will be updating with the hierarchical authentication / privilege checking in the future
      description: Gets all the users with a specified role
      operationId: getNimbusAllRoleUsers
      parameters:
        - name: roleName
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
      
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNimbusAllRoleUsersResponse'
        '400':
          description: Bad request
        '401':
          description: unauthorized error  
        '404':
          description: User not authorized to invoke function
        '500':
          description: Error invoking function
      
  /compute/cloudfn:
    post:
      tags:
        - compute
      summary: Invokes a cloud function
      operationId: invokeNimbusCloudFn
      requestBody:
        description: Invokes a cloud function
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeCloudFnRequestBody'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeCloudFnResponseBody'
        '400':
          description: Invaid cloud function
        '401':
          description: unauthorized error  
        '404':
          description: User not authorized to invoke function
        '501':
          description: Cloud function execution is not implemented
        '500':
          description: Error invoking function
  /file:
    put:
      tags:
        - file
      summary: Update an existing file
      description: Update an existing file by Id
      operationId: updateNimbusFile
      requestBody:
        description: Update an existent file in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/File'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: Invalid ID supplied
        '401':
          description: unauthorized error  
        '404':
          description: File not found
        '422':
          description: Validation exception
      security:
        - nimbus_auth:
            - write:files
            - read:files
    post:
      tags:
        - files
      summary: Add a new file to the store
      description: Add a new file to the store
      operationId: addNimbusFile
      requestBody:
        description: Create a new file in the store
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileCreateRequestBody'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        '400':
          description: Invalid input
        '401':
          description: unauthorized error  
        '422':
          description: Validation exception
        '500':
          description: Error invoking function  
      security:
        - nimbus_auth:
            - write:files
            - read:files
