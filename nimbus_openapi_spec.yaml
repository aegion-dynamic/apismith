  /extras/pdf/pdf-generate:
    post:
      summary: Generates a PDF
      operationId: generatePDF
      tags:
        - extras
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  description: "Typst source for the PDF. Parameters are bound as sys.params (use `#import sys: params` in the template). Image and attachment payloads are sent as base64 in JSON but decoded to binary before Typst; in the template, `params.images.<id>` and `params.attachments.<id>` are bytes (e.g. `#image(params.images.logo)`; pass attachment bytes directly to embedding APIs, not as filesystem paths). See docs/TYPST_DATA_GUIDE.md."
                fonts:
                  type: array
                  description: List of fonts data encoded as base64
                  items:
                    type: string
                parameters:
                  type: object
                  description: JSON object mapped to Typst dict fields under params (excluding reserved top-level keys images and attachments when those arrays are supplied). See docs/TYPST_DATA_GUIDE.md.
                images:
                  type: array
                  description: Images as base64 on the wire; Rust decodes to binary and exposes params.images.<id> as Typst bytes in the template (e.g. #image(params.images.logo)).
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the image (used to reference it in the template)
                      data:
                        type: string
                        description: Base64-encoded image data (supports PNG, JPEG, GIF, WebP, BMP)
                    required:
                      - id
                      - data
                attachments:
                  type: array
                  description: Attachments as base64 on the wire; Rust decodes to binary. In Typst, params.attachments.<id> is bytes — pass them to PDF-embedding packages directly, not via read() as a path. See docs/TYPST_DATA_GUIDE.md.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the attachment (used to reference it in the template)
                      data:
                        type: string
                        description: Base64-encoded attachment data (typically PDF files)
                    required:
                      - id
                      - data
              required:
                - template
                - fonts
                - parameters
      responses:
        '200':
          description: Generates a PDF from the typst template
          headers:
            Content-Disposition:
              description: Indicates that the content should be downloaded as an attachment
              schema:
                type: string
                default: 'attachment; filename="generated.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid typst template / generation error
        '401':
          description: Unauthorized error
        '500':
          description: Error generating the PDF
      security:
        - nimbus_auth: []
      
  /extras/pdf/pdf-generate-from-files:
    post:
      summary: Generates a PDF using filesystem UUIDs for images and attachments
      operationId: generatePDFFromFiles
      tags:
        - extras
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  description: "Typst source for the PDF. Parameters are bound as sys.params (use `#import sys: params` in the template). Image and attachment payloads are sent as base64 in JSON but decoded to binary before Typst; in the template, `params.images.<id>` and `params.attachments.<id>` are bytes (e.g. `#image(params.images.logo)`; pass attachment bytes directly to embedding APIs, not as filesystem paths). See docs/TYPST_DATA_GUIDE.md."
                fonts:
                  type: array
                  description: List of fonts data encoded as base64
                  items:
                    type: string
                parameters:
                  type: object
                  description: JSON object mapped to Typst dict fields under params (excluding reserved top-level keys images and attachments when those arrays are supplied). See docs/TYPST_DATA_GUIDE.md.
                images:
                  type: array
                  description: Server loads files by UUID and passes bytes to Rust; in Typst, params.images.<id> is bytes (e.g. #image(params.images.logo)). See docs/TYPST_DATA_GUIDE.md.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the image (used to reference it in the template)
                      uuid:
                        type: string
                        format: uuid
                        description: Filesystem UUID of the image file to retrieve and embed
                        x-go-type: uuid.UUID
                        x-go-type-import:
                          path: github.com/gofrs/uuid/v5
                    required:
                      - id
                      - uuid
                attachments:
                  type: array
                  description: Server loads files by UUID and passes bytes to Rust; in Typst, params.attachments.<id> is bytes for embedding (not a filesystem path). See docs/TYPST_DATA_GUIDE.md.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the attachment (used to reference it in the template)
                      uuid:
                        type: string
                        format: uuid
                        description: Filesystem UUID of the attachment file to retrieve and embed
                        x-go-type: uuid.UUID
                        x-go-type-import:
                          path: github.com/gofrs/uuid/v5
                    required:
                      - id
                      - uuid
              required:
                - template
                - fonts
                - parameters
      responses:
        '200':
          description: Generates a PDF from the typst template
          headers:
            Content-Disposition:
              description: Indicates that the content should be downloaded as an attachment
              schema:
                type: string
                default: 'attachment; filename="generated.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid typst template / generation error / file not found
        '401':
          description: Unauthorized error
        '404':
          description: One or more files (images/attachments) not found by UUID
        '500':
          description: Error generating the PDF or retrieving files from filesystem
      security:
        - nimbus_auth: []

  /acl/{resourceType}/{resourceId}:
    get:
      tags:
        - acl
      summary: List grants on a resource
      description: |-
        Returns every user and team grant on the resource, with the owner flagged.
        Caller must hold full control (read+write+execute) or be a superadmin.
      operationId: listNimbusResourceAcl
      parameters:
        - name: resourceType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AclResourceType'
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The resource's grant list (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AclEntry'
        '401':
          description: Unauthorized
        '403':
          description: Caller does not hold full control on this resource
        '404':
          description: Unknown resource
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []

    put:
      tags:
        - acl
      summary: Create or update a grant on a resource
      description: |-
        Upserts one subject's (user or team) rwx grant. Reducing the owner row's bits is
        refused; use transfer-ownership instead. Caller must hold full control.
      operationId: setNimbusResourceAcl
      parameters:
        - name: resourceType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AclResourceType'
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAclEntryBody'
      responses:
        '200':
          description: Grant stored
        '400':
          description: Invalid subject or bits
        '401':
          description: Unauthorized
        '403':
          description: Caller does not hold full control on this resource
        '409':
          description: Refused (e.g. reducing the owner row's bits); transfer ownership instead
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []

  /acl/{resourceType}/{resourceId}/{subjectType}/{subjectId}:
    delete:
      tags:
        - acl
      summary: Revoke one subject's grant on a resource
      description: |-
        Removes the subject's row. The owner row cannot be revoked (transfer first) and
        revoking the last remaining full-control user grant is refused so the resource
        always stays manageable. Caller must hold full control.
      operationId: revokeNimbusResourceAclEntry
      parameters:
        - name: resourceType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AclResourceType'
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subjectType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AclSubjectType'
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Grant removed (or already absent)
        '400':
          description: Invalid subjectType
        '401':
          description: Unauthorized
        '403':
          description: Caller does not hold full control on this resource
        '409':
          description: Refused (owner row, or last full-control grant)
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []

  /acl/{resourceType}/{resourceId}/transfer-ownership:
    post:
      tags:
        - acl
      summary: Transfer ownership of a resource
      description: |-
        Moves the owner mark to another user inside one transaction. The new owner
        receives full control; the previous owner keeps their other grants minus the
        owner flag (mirroring chown). Caller must hold full control.
      operationId: transferNimbusResourceOwnership
      parameters:
        - name: resourceType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AclResourceType'
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipBody'
      responses:
        '200':
          description: Ownership transferred
        '400':
          description: Invalid new owner
        '401':
          description: Unauthorized
        '403':
          description: Caller does not hold full control on this resource
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []

