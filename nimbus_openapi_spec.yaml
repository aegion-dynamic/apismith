        marking:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMarkingEntry'
        consumed:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMarkingEntry'
        produced:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMarkingEntry'
        enabledTransitions:
          type: array
          items:
            type: string
        deadlocked:
          type: boolean
        complete:
          type: boolean
        replay:
          type: boolean
          description: True when an idempotency key returned a prior fire
        transitionId:
          type: string

    WorkflowTransitionLogResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        instanceId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid/v5
        transitionId:
          type: string
        revision:
          type: integer
        consumed:
          type: array
          items:
