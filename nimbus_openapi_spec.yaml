        Returns a paginated list of all organizations. Each item includes the
        caller's membership status (admin, member, pending, or none) so the
        frontend can render appropriate action buttons.
      operationId: listNimbusOrganizations
      parameters:
        - name: limit
          in: query
          description: Number of results per page (default 20, max 100)
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of results to skip
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: search
          in: query
          description: Case-insensitive partial match against organization name or slug
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationListResponse'
        '401':
          description: unauthorized error
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []
    post:
      tags:
        - organizations
      summary: Create a new organization
      description: |-
        Creates a new organization. The caller automatically becomes both a
        member and an admin of the new organization. The slug must be unique,
        URL-friendly (lowercase alphanumeric + hyphens, 3-63 chars).
      operationId: createNimbusOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequestBody'
      responses:
        '201':
          description: Organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Bad request (empty name, invalid slug format)
        '401':
          description: unauthorized error
        '409':
          description: Slug already taken
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []

  /organizations/{organizationId}:
    get:
      tags:
        - organizations
      summary: Get organization details
      description: |-
        Returns details of a single organization including metadata.
        Caller must be a member or admin of the organization.
      operationId: getNimbusOrganization
      parameters:
        - name: organizationId
          in: path
          description: UUID of the organization
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '401':
          description: unauthorized error
        '403':
          description: Caller is not a member of the organization
        '404':
          description: Organization not found
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []
    patch:
      tags:
        - organizations
      summary: Update organization details
      description: |-
        Updates the name, slug, and/or metadata of an organization.
        Caller must be an admin of the organization.
        Only provided fields are updated; omitted fields remain unchanged.
      operationId: updateNimbusOrganization
      parameters:
        - name: organizationId
          in: path
          description: UUID of the organization
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequestBody'
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Invalid request (e.g. bad slug format, slug already taken)
        '401':
          description: unauthorized error
        '403':
          description: Caller is not an admin of the organization
        '404':
          description: Organization not found
        '409':
          description: Slug is already taken by another organization
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []
    delete:
      tags:
        - organizations
      summary: Delete an organization (owner only)
      description: Deletes the org and everything scoped to it (teams, memberships, admins, invitations, access requests, org/team role grants).
      operationId: deleteNimbusOrganization
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
      responses:
        '200':
          description: Organization deleted
        '401':
          description: unauthorized error
        '403':
          description: Caller is not the owner of the organization
        '404':
          description: Organization not found
      security:
        - nimbus_auth: []

  # --- Organization Membership & Access Request APIs ---

  /organizations/{organizationId}/members:
    get:
      tags:
        - organizations
      summary: List organization members
      description: Retrieve all members of the specified organization. Caller must be a member.
      operationId: listNimbusOrganizationMembers
      parameters:
        - name: organizationId
          in: path
          description: UUID of the organization
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
      responses:
        '200':
          description: List of organization members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationMemberResponse'
        '401':
          description: Unauthorized
        '403':
          description: Caller is not a member of the organization
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []
    post:
      tags:
        - organizations
      summary: Add a member directly (admin only)
      description: Admin directly adds a user as a member, bypassing the access-request flow.
      operationId: addNimbusOrganizationMember
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrgMemberBody'
      responses:
        '200':
          description: Member added
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Caller is not an admin of the organization
        '404':
          description: Not found
      security:
        - nimbus_auth: []

  /organizations/{organizationId}/members/{userId}:
    delete:
      tags:
        - organizations
      summary: Remove a member from an organization
      description: Remove a user from the specified organization. Caller must be an organization admin.
      operationId: removeNimbusOrganizationMember
      parameters:
        - name: organizationId
          in: path
          description: UUID of the organization
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
        - name: userId
          in: path
          description: UUID of the user to remove
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
      responses:
        '200':
          description: Member removed successfully
        '401':
          description: Unauthorized
        '403':
          description: Caller is not an admin of the organization
        '404':
          description: Membership not found
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []

  /organizations/{organizationId}/access-requests:
    get:
      tags:
        - organizations
      summary: List access requests for an organization
      description: Retrieve all access requests for the specified organization, optionally filtered by status. Caller must be an organization admin.
      operationId: listNimbusOrganizationAccessRequests
      parameters:
        - name: organizationId
          in: path
          description: UUID of the organization
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
        - name: status
          in: query
          description: Filter by request status (defaults to pending)
          required: false
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
            default: pending
      responses:
        '200':
          description: List of access requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationAccessRequestResponse'
        '401':
          description: Unauthorized
        '403':
          description: Caller is not an admin of the organization
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []
    post:
      tags:
        - organizations
      summary: Request access to an organization
      description: Submit a request to join the specified organization. The requesting user is derived from the JWT token.
      operationId: createNimbusOrganizationAccessRequest
      parameters:
        - name: organizationId
          in: path
          description: UUID of the organization to request access to
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
      responses:
        '201':
          description: Access request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAccessRequestResponse'
        '401':
          description: Unauthorized
        '409':
          description: A pending access request already exists for this user and organization
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []

  /organizations/{organizationId}/access-requests/{requestId}:
    put:
      tags:
        - organizations
      summary: Approve or reject an access request
      description: Approve or reject a pending access request. Caller must be an organization admin. Approving automatically adds the user as an organization member.
      operationId: processNimbusOrganizationAccessRequest
      parameters:
        - name: organizationId
          in: path
          description: UUID of the organization
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
        - name: requestId
          in: path
          description: UUID of the access request
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/gofrs/uuid/v5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestActionBody'
      responses:
        '200':
          description: Access request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAccessRequestResponse'
        '400':
          description: Bad request (invalid action)
        '401':
          description: Unauthorized
        '403':
          description: Caller is not an admin of the organization
        '404':
          description: Access request not found
        '500':
          description: Internal server error
      security:
        - nimbus_auth: []
    delete:
      tags:
        - organizations
      summary: Withdraw your own pending access request
      operationId: withdrawNimbusOrganizationAccessRequest
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
      responses:
        '200':
          description: Request withdrawn
        '401':
          description: Unauthorized
        '404':
          description: Access request not found
      security:
        - nimbus_auth: []

  /fileserve:
