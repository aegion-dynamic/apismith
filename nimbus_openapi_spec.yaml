          items:
            $ref: '#/components/schemas/WorkflowMarkingEntry'
        idempotencyKey:
          type: string
          nullable: true
        firedAt:
          type: string
          format: date-time

    AclSubjectType:
      type: string
      enum: [user, team]
    AclResourceType:
      type: string
      enum: [file_object, task_queue]
    SetAclEntryBody:
      type: object
      required: [subjectType, subjectId]
      properties:
        subjectType:
          $ref: '#/components/schemas/AclSubjectType'
        subjectId:
          type: string
          format: uuid
          description: User id or team id depending on subjectType
        read:
          type: boolean
          default: false
        write:
          type: boolean
          default: false
        execute:
          type: boolean
          default: false
    AclEntry:
      type: object
      required: [subjectType, subjectId]
      properties:
        subjectType:
          $ref: '#/components/schemas/AclSubjectType'
        subjectId:
